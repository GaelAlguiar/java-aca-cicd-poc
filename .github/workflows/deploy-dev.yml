name: Deploy Dev to Azure Container Apps

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: aca-cicd-demo-development
  cancel-in-progress: false

jobs:
  build-and-deploy:
    name: Build and Deploy Dev
    runs-on:
      - self-hosted
      - aca-poc
    environment: development
    env:
      ACR_NAME: ${{ vars.AZURE_CONTAINER_REGISTRY }}
      RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
      CONTAINER_APP_NAME: ${{ vars.AZURE_CONTAINER_APP_NAME }}
      APP_SERVICE_NAME: ${{ vars.APP_SERVICE_NAME }}
      APP_ENVIRONMENT: ${{ vars.APP_ENVIRONMENT }}
      APP_MESSAGE: ${{ vars.APP_MESSAGE }}
    steps:
      - name: Validate runner and deployment configuration
        shell: bash
        run: |
          for variable_name in \
            ACR_NAME RESOURCE_GROUP CONTAINER_APP_NAME \
            APP_SERVICE_NAME APP_ENVIRONMENT APP_MESSAGE; do
            if [ -z "${!variable_name}" ]; then
              echo "::error::Missing GitHub environment variable: $variable_name"
              exit 1
            fi
          done
          command -v docker >/dev/null || { echo "::error::Docker is required"; exit 1; }
          command -v az >/dev/null || { echo "::error::Azure CLI is required"; exit 1; }
          az containerapp --help >/dev/null \
            || { echo "::error::Azure CLI must include the containerapp command group"; exit 1; }

      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Setup Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Verify with Maven
        run: ./mvnw --batch-mode clean verify

      - name: Login to Azure with OIDC
        uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Build and push image to ACR
        id: image
        shell: bash
        run: |
          IMAGE_NAME="${ACR_NAME}.azurecr.io/aca-cicd-demo:${GITHUB_SHA}"
          az acr login --name "$ACR_NAME"
          docker build --platform linux/amd64 --tag "$IMAGE_NAME" .
          [ "$(docker image inspect "$IMAGE_NAME" --format '{{.Architecture}}')" = "amd64" ] \
            || { echo "::error::Container image must target linux/amd64"; exit 1; }
          docker push "$IMAGE_NAME"
          echo "name=$IMAGE_NAME" >> "$GITHUB_OUTPUT"

      - name: Deploy a new Container Apps revision
        shell: bash
        run: |
          az containerapp update \
            --name "$CONTAINER_APP_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --image "${{ steps.image.outputs.name }}" \
            --set-env-vars \
              "APP_SERVICE_NAME=$APP_SERVICE_NAME" \
              "APP_ENVIRONMENT=$APP_ENVIRONMENT" \
              "APP_MESSAGE=$APP_MESSAGE"

      - name: Verify deployment health
        shell: bash
        run: |
          REVISION_NAME="$(az containerapp show \
            --name "$CONTAINER_APP_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --query properties.latestRevisionName \
            --output tsv)"

          REVISION_IMAGE="$(az containerapp revision show \
            --name "$CONTAINER_APP_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --revision "$REVISION_NAME" \
            --query properties.template.containers[0].image \
            --output tsv)"

          if [ "$REVISION_IMAGE" != "${{ steps.image.outputs.name }}" ]; then
            echo "::error::Latest revision does not use the image built by this workflow"
            exit 1
          fi

          for attempt in {1..30}; do
            RUNNING_STATE="$(az containerapp revision show \
              --name "$CONTAINER_APP_NAME" \
              --resource-group "$RESOURCE_GROUP" \
              --revision "$REVISION_NAME" \
              --query properties.runningState \
              --output tsv)"
            [[ "$RUNNING_STATE" == Running* ]] && break
            [ "$attempt" -eq 30 ] && { echo "::error::Revision did not reach Running state"; exit 1; }
            sleep 10
          done

          REVISION_FQDN="$(az containerapp revision show \
            --name "$CONTAINER_APP_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --revision "$REVISION_NAME" \
            --query properties.fqdn \
            --output tsv)"

          curl --fail --retry 12 --retry-delay 10 --retry-all-errors \
            "https://${REVISION_FQDN}/actuator/health"

          INFO_RESPONSE="$(curl --fail --silent "https://${REVISION_FQDN}/api/info")"
          echo "$INFO_RESPONSE"
          grep --fixed-strings --quiet "\"service\":\"$APP_SERVICE_NAME\"" <<< "$INFO_RESPONSE"
          grep --fixed-strings --quiet "\"environment\":\"$APP_ENVIRONMENT\"" <<< "$INFO_RESPONSE"
          grep --fixed-strings --quiet "\"message\":\"$APP_MESSAGE\"" <<< "$INFO_RESPONSE"
